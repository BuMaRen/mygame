<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>practise</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>practise</h1>
    <p>AI 时代职业晋升技能练习。每项技能一个子站点。</p>
  </div>
  <div class="grid grid-2" id="skills"></div>
</main>
<script type="module">
import { topbar, api, esc, today } from '/assets/app.js';

topbar({ brand: 'practise' });

const SKILLS = [
  { key: 'english', icon: '🔤', name: 'English', desc: '顺畅阅读技术与日常英文，能做基本回复和闲聊', href: '/english/', ready: true },
  { key: 'coding', icon: '⌨️', name: '算法编码', desc: '24 个基础题主题 · 本地 AI 出题与评估', href: '/coding/', ready: true },
  { key: 'system-design', icon: '🧩', name: '系统设计', desc: '项目相关理念优先 · 通用架构题 · 答题模板与 AI 评估', href: '/system-design/', ready: true },
  { key: 'testing', icon: '🧪', name: '测试', desc: '待开始' },
];

async function englishStats() {
  const [checkins, words, settings] = await Promise.all([
    api.get('english', 'checkins', []),
    api.get('english', 'words', []),
    api.get('english', 'settings', {}),
  ]);
  const done = checkins.filter((c) => c.done);
  const todayDone = done.some((c) => c.date === today());
  return `<div class="row small" style="margin-top:10px">
    <span class="badge ${todayDone ? 'ok' : 'warn'}">${todayDone ? '今日已打卡' : '今日未打卡'}</span>
    <span class="muted">打卡 ${done.length} 天 · 生词 ${words.length} 个</span>
    ${settings.startDate ? '' : '<span class="muted">· 尚未设置开始日期</span>'}
  </div>`;
}

const el = document.getElementById('skills');
el.innerHTML = SKILLS.map((s) => s.ready
  ? `<a class="card" href="${s.href}"><div class="card-icon">${s.icon}</div><h2 style="margin:0 0 4px">${esc(s.name)}</h2><p class="muted" style="margin:0">${esc(s.desc)}</p><div id="stats-${s.key}"></div></a>`
  : `<div class="card disabled"><div class="card-icon">${s.icon}</div><h2 style="margin:0 0 4px">${esc(s.name)}</h2><p class="muted" style="margin:0">${esc(s.desc)}</p></div>`
).join('');

englishStats().then((h) => (document.getElementById('stats-english').innerHTML = h)).catch(() => {});
</script>
</body>
</html>
