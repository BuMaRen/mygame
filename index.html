<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b2832" />
  <title>九州行军录</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">九</span><div><strong>九州行军录</strong><small>像素三国 · 策略经营</small></div></div>
      <div class="turn-info"><span id="dateLabel"></span><span class="divider"></span><span id="factionLabel"></span><span class="divider"></span><span id="ownedLabel"></span></div>
      <div class="top-actions"><button id="helpButton" class="icon-button" title="玩法说明">?</button><button id="newGameButtonTop" class="subtle-button">新局 / 选军阀</button><button id="saveButton" class="subtle-button">存档</button><button id="endTurnButton" class="primary-button">结束本月 <b>↵</b></button></div>
    </header>

    <main class="layout">
      <section id="worldPanel" class="world-panel">
        <div class="map-title"><div><span class="tag">天下形势</span><h1>九州地图</h1></div><div class="map-tools"><span id="legendPlayer" class="legend"><i class="legend-dot player"></i>我军</span><span id="legendRival" class="legend"><i class="legend-dot rival"></i>曹军</span><span id="legendOther" class="legend"><i class="legend-dot other"></i>孙军</span></div></div>
        <div class="map-frame"><canvas id="worldMap" width="800" height="544" aria-label="九州战略地图"></canvas><div class="map-vignette"></div><div id="mapHint" class="map-hint">点击城池查看详情 · 点击空白处返回阵营总览</div></div>
        <div class="bottom-strip"><span>点击城池查看详情；选中后可用方向键 / WASD 切换</span><span><kbd>Esc</kbd> 阵营总览　<kbd>N</kbd> 结束本月</span></div>
      </section>

      <section id="townPanel" class="world-panel town-panel hidden">
        <div class="map-title"><div><span class="tag">城内游览</span><h1 id="townTitle">城内地图</h1></div><button id="leaveTownButton" class="subtle-button">返回战略地图</button></div>
        <div class="town-frame"><canvas id="townMap" width="240" height="160" aria-label="可步行探索的城内像素地图"></canvas></div>
        <div class="town-guide"><span id="townHint">方向键 / WASD 行走，靠近建筑后按 Enter 交互</span><div class="town-controls"><button data-move="up" aria-label="向上">▲</button><button data-move="left" aria-label="向左">◀</button><button data-move="down" aria-label="向下">▼</button><button data-move="right" aria-label="向右">▶</button><button id="interactButton">交互</button></div></div>
      </section>

      <aside class="sidebar">
        <div id="factionOverview">
          <div class="sidebar-heading"><span class="eyebrow">天下形势</span><h2>阵营总览</h2><p>点击地图上的城池，再查看具体城池事务</p></div>
          <div id="factionCards" class="faction-cards"></div>
          <div class="section-head log-title"><h3>军报</h3><span>最近动态</span></div>
          <div id="overviewLog" class="log"></div>
        </div>
        <div id="cityDetails" class="hidden">
        <div class="sidebar-heading"><span class="eyebrow">城池事务</span><h2 id="cityName"></h2><p id="citySubtitle"></p></div>
        <button id="backToOverview" class="back-overview-button">← 返回阵营总览</button>
        <div class="city-banner"><span id="cityOwnerBadge" class="owner-badge"></span><span id="cityLevel"></span><span id="cityAction"></span></div>
        <button id="enterTownButton" class="enter-town-button">进入城池游览 <span>↗</span></button>
        <div class="stats-grid" id="statsGrid"></div>
        <div class="section-head"><h3>城池指令</h3><span id="actionCount"></span></div>
        <div id="actions" class="actions"></div>
        <div class="section-head officers-title"><h3>驻城武将</h3><span id="officerCount"></span></div>
        <div id="officers" class="officers"></div>
        <div class="section-head log-title"><h3>军报</h3><span>最近动态</span></div>
        <div id="log" class="log"></div>
        </div>
      </aside>
    </main>
  </div>

  <div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="icon-button">×</button></div><div id="modalContent"></div></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="game.js"></script>
  <script src="town.js"></script>
</body>
</html>
