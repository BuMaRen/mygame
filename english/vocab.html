<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English · 词汇</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>词汇</h1>
    <p>只记读到的、觉得会再遇到的词，每天 3–5 个，一定抄原句。复习时连续 3 次都懂，就自动变成"熟词"不再出现。</p>
  </div>

  <div class="tabs">
    <button data-tab="review">复习</button>
    <button data-tab="mine">我的生词</button>
    <button data-tab="seeds">种子词表</button>
    <button data-tab="quiz">每周小测</button>
  </div>

  <section data-panel="review">
    <div class="row" style="margin-bottom:12px">
      <label class="row" style="margin:0;color:var(--text)"><input type="radio" name="scope" value="recent" checked> 最近 7 天</label>
      <label class="row" style="margin:0;color:var(--text)"><input type="radio" name="scope" value="all"> 所有未熟的词（周五用）</label>
      <span class="spacer"></span>
      <span class="muted small" id="review-count"></span>
    </div>
    <div class="card flash" id="flash"></div>
  </section>

  <section data-panel="mine">
    <div class="card" style="margin-bottom:16px">
      <h3>添加生词</h3>
      <div class="fields">
        <div class="field"><label>词 / 短语</label><input type="text" id="f-word"></div>
        <div class="field"><label>中文（这个语境下的）</label><input type="text" id="f-meaning"></div>
        <div class="field"><label>出处</label><input type="text" id="f-source" placeholder="Playwright docs / Reddit / 剧名"></div>
      </div>
      <div class="field"><label>原句</label><textarea id="f-sentence" rows="2" placeholder="抄下你读到它的那句话"></textarea></div>
      <button class="btn primary" id="f-add">添加</button>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <input type="text" id="search" placeholder="搜索" style="max-width:240px">
        <label class="row" style="margin:0;color:var(--text)"><input type="checkbox" id="hide-known"> 隐藏熟词</label>
        <span class="spacer"></span><span class="muted small" id="mine-count"></span>
      </div>
      <div class="table-wrap"><table id="mine-table"></table></div>
    </div>
  </section>

  <section data-panel="seeds">
    <div class="tabs" id="seed-tabs" style="margin-bottom:12px"></div>
    <div id="seed-body"></div>
  </section>

  <section data-panel="quiz">
    <div class="card">
      <h3>每周小测</h3>
      <p class="muted">把本周新记的词交给 AI 出填空题。周五做。</p>
      <pre class="prompt" id="quiz-prompt"></pre>
      <button class="btn primary" id="quiz-copy">复制提示词</button>
    </div>
  </section>
</main>
<script type="module">
import { esc, today, ymd, uid, toast, copy, tabs, fail } from '/assets/app.js';
import { header, load, save, addWordDialog } from './js/common.js';
import { SEEDS } from './content/vocab.js';

header('vocab');

let words = [];
const persist = () => save('words', words).catch(fail);
const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); };
const norm = (s) => s.trim().toLowerCase();

// ---------- review ----------
let queue = [];
let showMeaning = false;
function buildQueue() {
  const scope = document.querySelector('input[name=scope]:checked').value;
  const since = daysAgo(6);
  queue = words.filter((w) => !w.known && (scope === 'all' || w.date >= since));
  // Least-reviewed first, then oldest.
  queue.sort((a, b) => (a.streak || 0) - (b.streak || 0) || a.date.localeCompare(b.date));
  showMeaning = false;
  renderFlash();
}
function renderFlash() {
  const el = document.getElementById('flash');
  document.getElementById('review-count').textContent = `剩 ${queue.length} 个`;
  if (!queue.length) {
    el.innerHTML = `<div class="empty">${words.length ? '这一组复习完了 👍' : '还没有生词。去"我的生词"或"种子词表"添加。'}</div>`;
    return;
  }
  const w = queue[0];
  el.innerHTML = `
    <div class="word">${esc(w.word)}</div>
    <div class="sentence">${w.sentence ? esc(w.sentence) : '<span class="muted">（没有原句）</span>'}</div>
    <div class="muted small">${esc(w.source || '')} · ${w.date} · 已连续懂 ${w.streak || 0}/3 次</div>
    ${showMeaning
      ? `<div class="meaning">${esc(w.meaning || '（没写中文）')}</div>
         <div class="row" style="justify-content:center;margin-top:12px">
           <button class="btn bad" id="no">没懂</button>
           <button class="btn ok" id="yes">懂了</button>
         </div>`
      : `<div style="margin-top:16px"><button class="btn primary" id="show">先自己想，再看中文</button></div>`}`;
  el.querySelector('#show')?.addEventListener('click', () => { showMeaning = true; renderFlash(); });
  el.querySelector('#yes')?.addEventListener('click', () => grade(true));
  el.querySelector('#no')?.addEventListener('click', () => grade(false));
}
function grade(ok) {
  const w = queue.shift();
  w.lastReview = today();
  w.streak = ok ? (w.streak || 0) + 1 : 0;
  if (w.streak >= 3) { w.known = true; toast(`"${w.word}" 变成熟词了`); }
  persist();
  showMeaning = false;
  renderFlash();
  renderMine();
}
document.querySelectorAll('input[name=scope]').forEach((r) => (r.onchange = buildQueue));

// ---------- my words ----------
function renderMine() {
  const q = norm(document.getElementById('search').value);
  const hideKnown = document.getElementById('hide-known').checked;
  const list = words
    .filter((w) => !hideKnown || !w.known)
    .filter((w) => !q || [w.word, w.meaning, w.sentence, w.source].some((s) => norm(s || '').includes(q)))
    .slice().reverse();
  document.getElementById('mine-count').textContent = `共 ${words.length} 个，熟词 ${words.filter((w) => w.known).length} 个`;
  document.getElementById('mine-table').innerHTML = list.length
    ? `<tr><th>日期</th><th>词</th><th>原句（出处）</th><th>中文</th><th>熟</th><th></th></tr>` +
      list.map((w) => `<tr>
        <td class="small muted">${w.date}</td>
        <td><b>${esc(w.word)}</b></td>
        <td>${esc(w.sentence || '')}${w.source ? ` <span class="muted small">(${esc(w.source)})</span>` : ''}</td>
        <td>${esc(w.meaning || '')}</td>
        <td><button class="btn ghost sm" data-known="${w.id}" title="切换熟词">${w.known ? '✓' : `${w.streak || 0}/3`}</button></td>
        <td><button class="btn ghost sm" data-del="${w.id}">删除</button></td>
      </tr>`).join('')
    : '<tr><td class="empty">没有符合的词。</td></tr>';
  document.querySelectorAll('[data-known]').forEach((b) => (b.onclick = () => {
    const w = words.find((x) => x.id === b.dataset.known);
    w.known = !w.known;
    if (!w.known) w.streak = 0;
    persist(); renderMine();
  }));
  document.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => {
    const w = words.find((x) => x.id === b.dataset.del);
    if (!confirm(`删除 "${w.word}"？`)) return;
    words = words.filter((x) => x !== w);
    persist(); renderMine(); renderSeeds();
  }));
}
document.getElementById('search').oninput = renderMine;
document.getElementById('hide-known').onchange = renderMine;

const F = (id) => document.getElementById('f-' + id);
F('add').onclick = () => {
  const word = F('word').value.trim();
  if (!word) return toast('先填词');
  if (words.some((w) => norm(w.word) === norm(word)) && !confirm(`"${word}" 已经在生词本里，还要再加一条吗？`)) return;
  words.push({ id: uid(), date: today(), word, meaning: F('meaning').value.trim(), sentence: F('sentence').value.trim(), source: F('source').value.trim(), streak: 0, known: false });
  ['word', 'meaning', 'sentence'].forEach((k) => (F(k).value = ''));
  persist(); renderMine(); renderSeeds(); renderQuiz();
  toast('已添加');
  F('word').focus();
};

// ---------- seeds ----------
let seedKey = SEEDS[0].key;
function renderSeeds() {
  const have = new Set(words.map((w) => norm(w.word)));
  document.getElementById('seed-tabs').innerHTML = SEEDS.map((s) => `<button data-seed="${s.key}" class="${s.key === seedKey ? 'active' : ''}">${esc(s.title)}</button>`).join('');
  document.querySelectorAll('[data-seed]').forEach((b) => (b.onclick = () => { seedKey = b.dataset.seed; renderSeeds(); }));
  const seed = SEEDS.find((s) => s.key === seedKey);
  document.getElementById('seed-body').innerHTML = `<p class="muted">${esc(seed.note)} 不认识的点"加入"，弹窗里已带上例句，确认后留在本页继续挑。</p>` +
    seed.groups.map((g, gi) => `<div class="card" style="margin-bottom:14px">
      <h3>${esc(g.name)}</h3>
      <div class="table-wrap"><table>
        ${g.items.map(([w, m, ex], ii) => `<tr>
          <td style="width:28%"><b>${esc(w)}</b></td><td style="width:28%">${esc(m)}</td>
          <td class="muted">${esc(ex || '')}</td>
          <td style="width:70px;text-align:right">${have.has(norm(w)) ? '<span class="badge ok">已加入</span>' : `<button class="btn sm" data-add="${gi}-${ii}">加入</button>`}</td>
        </tr>`).join('')}
      </table></div></div>`).join('');
  document.querySelectorAll('[data-add]').forEach((b) => (b.onclick = async () => {
    const [gi, ii] = b.dataset.add.split('-').map(Number);
    const [w, m, ex] = seed.groups[gi].items[ii];
    const added = await addWordDialog({ word: w, meaning: m, sentence: ex || '', source: '种子词表' });
    if (!added) return;
    words.push(added);
    renderSeeds(); renderMine(); renderQuiz();
  }));
}

// ---------- quiz ----------
function renderQuiz() {
  const monday = new Date(); monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  const since = ymd(monday);
  const list = words.filter((w) => w.date >= since);
  const text = `Here are words I learned this week:
${list.length ? list.map((w) => `- ${w.word}${w.sentence ? ` (from: "${w.sentence}")` : ''}`).join('\n') : '- （本周还没有新词）'}

Quiz me: for each word, give a new sentence with a blank. I fill in the word.
One at a time. After all of them, tell me which ones I got wrong.`;
  document.getElementById('quiz-prompt').textContent = text;
  document.getElementById('quiz-copy').onclick = () => copy(text);
}

tabs(document.querySelector('main'), (k) => { if (k === 'review') buildQueue(); });

try {
  words = await load('words');
  buildQueue(); renderMine(); renderSeeds(); renderQuiz();
} catch (e) { fail(e); }
</script>
</body>
</html>
