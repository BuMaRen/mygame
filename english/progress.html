<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English · 进度</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>进度</h1>
    <p>只算工作日。漏了一天不补，接着往下走。周五花 10 分钟做本周回顾。</p>
  </div>

  <div class="tabs">
    <button data-tab="checkins">打卡</button>
    <button data-tab="review">周回顾</button>
    <button data-tab="phases">阶段检查</button>
  </div>

  <section data-panel="checkins">
    <div class="grid grid-2">
      <div class="card">
        <div class="row"><h3 style="margin:0" id="cal-title"></h3><span class="spacer"></span>
          <button class="btn sm" id="prev">←</button><button class="btn sm" id="next">→</button></div>
        <div class="row small muted" style="margin:8px 0 12px"><span class="badge tech">技术</span><span class="badge daily">日常</span> 已打卡</div>
        <div class="cal" id="cal"></div>
      </div>
      <div class="card">
        <h3>最近打卡</h3>
        <div class="table-wrap"><table id="ci-table"></table></div>
      </div>
    </div>
  </section>

  <section data-panel="review">
    <div class="card" style="margin-bottom:16px">
      <h3 id="rv-title">本周回顾</h3>
      <div class="grid grid-4" id="rv-stats" style="margin-bottom:14px"></div>
      <div class="field"><label>最大的进步</label><input type="text" id="rv-wins"></div>
      <div class="field"><label>最卡的地方</label><input type="text" id="rv-stuck"></div>
      <div class="field"><label>下周调整</label><input type="text" id="rv-adjust" placeholder="闲聊总卡壳 → 周三换成日常线"></div>
      <div class="row">
        <button class="btn primary" id="rv-save">保存本周回顾</button>
        <a class="btn" href="vocab.html#quiz">去做每周小测 →</a>
      </div>
    </div>
    <div id="rv-list"></div>
  </section>

  <section data-panel="phases">
    <div id="phase-list"></div>
  </section>
</main>
<script type="module">
import { esc, today, ymd, parseYmd, WEEKDAYS, toast, tabs, fail } from '/assets/app.js';
import { header, load, save } from './js/common.js';
import { PHASES, weekNumber, phaseOf, isWorkday } from './js/plan.js';

header('progress');
tabs(document.querySelector('main'));

let settings, checkins, reviews, phases, words, reading, journal;
let month = new Date(); month.setDate(1);

// ---------- calendar ----------
function renderCal() {
  const y = month.getFullYear(), m = month.getMonth();
  document.getElementById('cal-title').textContent = `${y} 年 ${m + 1} 月`;
  const byDate = Object.fromEntries(checkins.filter((c) => c.done).map((c) => [c.date, c]));
  const cells = ['一', '二', '三', '四', '五'].map((d) => `<div class="head">${d}</div>`);
  const first = new Date(y, m, 1);
  const lead = (first.getDay() + 6) % 7; // Monday-based offset; a weekend 1st starts on Monday's column
  for (let i = 0; i < (lead < 5 ? lead : 0); i++) cells.push('<div></div>');
  const todayStr = today();
  for (let d = new Date(first); d.getMonth() === m; d.setDate(d.getDate() + 1)) {
    if (!isWorkday(d)) continue;
    const key = ymd(d);
    const c = byDate[key];
    cells.push(`<div class="day ${c ? c.track || 'tech' : ''} ${key === todayStr ? 'today' : ''} ${key > todayStr ? 'future' : ''}" title="${key}${c ? ` · ${c.minutes} 分钟${c.note ? ' · ' + esc(c.note) : ''}` : ''}">${d.getDate()}</div>`);
  }
  document.getElementById('cal').innerHTML = cells.join('');

  const list = checkins.filter((c) => c.done).slice(-15).reverse();
  document.getElementById('ci-table').innerHTML = list.length
    ? '<tr><th>日期</th><th>线</th><th>分钟</th><th>记录</th></tr>' + list.map((c) => `<tr>
        <td class="small">${c.date} ${WEEKDAYS[parseYmd(c.date).getDay()]}</td>
        <td>${c.track ? `<span class="badge ${c.track}">${c.track === 'tech' ? '技术' : '日常'}</span>` : ''}</td>
        <td>${c.minutes}</td><td>${esc(c.note || '')}</td></tr>`).join('')
    : '<tr><td class="empty">还没有打卡。去<a href="./">今日</a>页打卡。</td></tr>';
}
document.getElementById('prev').onclick = () => { month.setMonth(month.getMonth() - 1); renderCal(); };
document.getElementById('next').onclick = () => { month.setMonth(month.getMonth() + 1); renderCal(); };

// ---------- weekly review ----------
function weekRange(date = new Date()) {
  const mon = new Date(date); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const fri = new Date(mon); fri.setDate(fri.getDate() + 4);
  return [ymd(mon), ymd(fri)];
}
function renderReview() {
  const [from, to] = weekRange();
  const week = weekNumber(settings.startDate);
  const inWeek = (d) => d >= from && d <= to;
  const stat = (num, label) => `<div class="card stat" style="padding:12px"><div class="num">${num}</div><div class="label">${label}</div></div>`;
  document.getElementById('rv-title').textContent = `${week ? `第 ${week} 周` : '本周'}回顾（${from} ~ ${to}）`;
  document.getElementById('rv-stats').innerHTML =
    stat(`${checkins.filter((c) => c.done && inWeek(c.date)).length}/5`, '打卡天数') +
    stat(words.filter((w) => inWeek(w.date)).length, '新词') +
    stat(words.filter((w) => w.known).length, '熟词累计') +
    stat(`${reading.filter((r) => inWeek(r.date)).length} · ${journal.filter((j) => inWeek(j.date)).length}`, '阅读 · 写作');

  const cur = reviews.find((r) => r.from === from);
  ['wins', 'stuck', 'adjust'].forEach((k) => (document.getElementById('rv-' + k).value = cur?.[k] || ''));

  document.getElementById('rv-list').innerHTML = reviews.slice().reverse().map((r) => `
    <div class="card" style="margin-bottom:12px">
      <div class="row small"><b>${r.week ? `第 ${r.week} 周` : ''}</b><span class="muted">${r.from} ~ ${r.to}</span><span class="spacer"></span>
        <span class="muted">打卡 ${r.stats.checkins}/5 · 新词 ${r.stats.words} · 熟词 ${r.stats.known} · 阅读 ${r.stats.reading}</span></div>
      ${r.wins ? `<div style="margin-top:6px"><span class="muted small">进步：</span>${esc(r.wins)}</div>` : ''}
      ${r.stuck ? `<div><span class="muted small">卡点：</span>${esc(r.stuck)}</div>` : ''}
      ${r.adjust ? `<div><span class="muted small">调整：</span>${esc(r.adjust)}</div>` : ''}
    </div>`).join('');
}
document.getElementById('rv-save').onclick = async () => {
  const [from, to] = weekRange();
  const inWeek = (d) => d >= from && d <= to;
  const rec = {
    from, to, week: weekNumber(settings.startDate), date: today(),
    wins: document.getElementById('rv-wins').value.trim(),
    stuck: document.getElementById('rv-stuck').value.trim(),
    adjust: document.getElementById('rv-adjust').value.trim(),
    stats: {
      checkins: checkins.filter((c) => c.done && inWeek(c.date)).length,
      words: words.filter((w) => inWeek(w.date)).length,
      known: words.filter((w) => w.known).length,
      reading: reading.filter((r) => inWeek(r.date)).length,
    },
  };
  reviews = reviews.filter((r) => r.from !== from).concat(rec).sort((a, b) => a.from.localeCompare(b.from));
  try { await save('reviews', reviews); toast('已保存'); renderReview(); } catch (e) { fail(e); }
};

// ---------- phases ----------
function renderPhases() {
  const week = weekNumber(settings.startDate);
  const cur = phaseOf(week);
  document.getElementById('phase-list').innerHTML = PHASES.map((p) => {
    const done = phases[p.n];
    return `<div class="card" style="margin-bottom:12px">
      <div class="row"><h3 style="margin:0">阶段 ${p.n} · ${esc(p.name)}</h3><span class="muted small">第 ${p.from}–${p.to} 周</span>
        ${done ? `<span class="badge ok">✓ ${done} 达成</span>` : cur?.n === p.n ? '<span class="badge tech">进行中</span>' : ''}</div>
      <p style="margin:8px 0">${esc(p.goal)}</p>
      <div class="row">${done
        ? `<button class="btn sm" data-undo="${p.n}">取消达成</button>`
        : `<button class="btn sm ok" data-done="${p.n}">我达到了</button><span class="muted small">没达到就多留一两周，不用硬推进。</span>`}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('[data-done]').forEach((b) => (b.onclick = async () => {
    phases[b.dataset.done] = today();
    try { await save('phases', phases); toast('恭喜 🎉'); renderPhases(); } catch (e) { fail(e); }
  }));
  document.querySelectorAll('[data-undo]').forEach((b) => (b.onclick = async () => {
    delete phases[b.dataset.undo];
    try { await save('phases', phases); renderPhases(); } catch (e) { fail(e); }
  }));
}

try {
  [settings, checkins, reviews, phases, words, reading, journal] = await Promise.all(
    ['settings', 'checkins', 'reviews', 'phases', 'words', 'reading', 'journal'].map(load));
  renderCal(); renderReview(); renderPhases();
} catch (e) { fail(e); }
</script>
</body>
</html>
