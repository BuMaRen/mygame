<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English · 今日</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  .passage p { font-size: 1.05rem; line-height: 1.8; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .task-detail { color: var(--muted); font-size: .88rem; margin-top: 2px; }
</style>
</head>
<body>
<main>
  <div id="setup" class="card hidden" style="margin-bottom:16px">
    <h2>先设置开始日期</h2>
    <p class="muted">计划从这一周算第 1 周。建议从本周或下周一开始。</p>
    <div class="row">
      <input type="date" id="start" style="max-width:200px">
      <button class="btn primary" id="save-start">开始</button>
    </div>
  </div>

  <div class="grid grid-2">
    <div class="grid" style="align-content:start">
      <div class="card">
        <div class="row" style="margin-bottom:8px">
          <h2 style="margin:0" id="date-title"></h2>
          <span id="track-badge"></span>
          <span class="spacer"></span>
          <a class="small hidden" id="back-today" href="./">← 回到今天</a>
        </div>
        <p class="muted small" id="week-line"></p>
        <div id="plan"></div>
        <div id="checkin" style="margin-top:14px"></div>
      </div>
      <div class="card hidden" id="reading-card"></div>
      <div class="card hidden" id="writing-card"></div>
    </div>

    <div class="grid" style="align-content:start">
      <div class="grid grid-2x2" id="stats"></div>
      <div class="card">
        <h3>阶段</h3>
        <div id="phase"></div>
      </div>
      <div class="card">
        <h3>历史计划</h3>
        <div id="history" class="small"></div>
      </div>
      <div class="card">
        <h3>每周安排</h3>
        <div class="table-wrap"><table class="small">
          <tr><th>周一</th><th>周二</th><th>周三</th><th>周四</th><th>周五</th><th>周末</th></tr>
          <tr>
            <td><span class="badge tech">技术</span></td>
            <td><span class="badge daily">日常</span></td>
            <td><span class="badge tech">技术</span></td>
            <td><span class="badge daily">日常</span></td>
            <td><span class="badge tech">技术</span><br><span class="muted">+ 周回顾</span></td>
            <td class="muted">休息</td>
          </tr>
        </table></div>
        <p class="muted small" style="margin:8px 0 0">每天的计划由本地 claude CLI 根据计划框架和你的训练情况生成，当天生成后就固定，不会再变。</p>
      </div>
    </div>
  </div>
</main>
<script type="module">
import { esc, today, WEEKDAYS, toast, fail } from '/assets/app.js';
import { header, load, save, planLink } from './js/common.js';
import { TRACK_BY_DAY, TRACK_LABEL, PHASES, weekNumber, phaseOf, workdayStreak, parseYmd } from './js/plan.js';

header('home');

const viewDate = new URLSearchParams(location.search).get('date') || today();
const isToday = viewDate === today();
let settings, checkins, words, reading, journal;
let plan = null;
let material = null;
let planState = 'idle'; // idle | loading | error | ready
let planError = '';

const recordFor = (date) => checkins.find((c) => c.date === date);

async function upsertToday(patch) {
  let rec = recordFor(today());
  if (!rec) {
    rec = { date: today(), track: TRACK_BY_DAY[new Date().getDay()] || null, tasks: [], minutes: 0, note: '', done: false };
    checkins.push(rec);
    checkins.sort((a, b) => a.date.localeCompare(b.date));
  }
  Object.assign(rec, patch);
  await save('checkins', checkins);
  return rec;
}

// ---------- plan loading ----------

async function fetchPlan(date) {
  const r = await fetch(`/api/english/plan?date=${date}`);
  if (!r.ok) throw new Error(`读取计划失败：${r.status}`);
  return r.json();
}

async function fetchMaterial(date) {
  const r = await fetch(`/api/english/material?date=${date}`);
  return r.ok ? r.json() : null;
}

async function generatePlan() {
  planState = 'loading';
  render();
  try {
    const r = await fetch('/api/english/plan', { method: 'POST' });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || `生成失败：${r.status}`);
    plan = body;
    material = await fetchMaterial(viewDate);
    planState = 'ready';
    loadHistory();
  } catch (e) {
    planState = 'error';
    planError = e.message;
  }
  render();
}

// ---------- rendering ----------

// Links from the plan carry ?from=plan so the practice page can lead back here.
// Plans from before the reading page had a "today" tab linked to its old tabs.
function taskLink(t) {
  if (!t.link || !isToday) return t.link;
  const link = /^reading\.html(#(log|sources))?$/.test(t.link) ? 'reading.html#today' : t.link;
  return planLink(link, t.id);
}

function renderPlan(track, week) {
  const el = document.getElementById('plan');
  const rec = recordFor(viewDate);

  if (!track) { el.innerHTML = '<p class="muted">周末休息。想练的话随便读点感兴趣的英文就好，不算任务。</p>'; return; }
  if (!settings.startDate || !week || week < 1) { el.innerHTML = ''; return; }
  if (planState === 'loading') {
    el.innerHTML = `<div class="row" style="padding:16px 0;flex-wrap:nowrap"><div class="spinner"></div><span>正在调用本地 claude 生成今天的计划……通常需要 30–90 秒。</span></div>`;
    return;
  }
  if (planState === 'error') {
    el.innerHTML = `<div class="banner" style="border-radius:8px;text-align:left">生成失败：${esc(planError)}</div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="retry">重试</button>
      <span class="muted small">需要本机能运行 <code>claude</code> 命令并已登录。</span></div>`;
    el.querySelector('#retry').onclick = generatePlan;
    return;
  }
  if (!plan) {
    el.innerHTML = isToday
      ? '<button class="btn primary" id="gen">生成今天的计划</button>'
      : '<p class="muted">这一天没有生成计划。</p>';
    el.querySelector('#gen')?.addEventListener('click', generatePlan);
    return;
  }

  const tasks = [...plan.tasks, { id: 'checkin', title: '打卡', detail: '', minutes: 1, link: '' }];
  el.innerHTML = `
    <p style="margin-bottom:4px"><b>${esc(plan.focus)}</b></p>
    <p class="muted small">${esc(plan.adjustments)}</p>
    <ul class="tasks">${tasks.map((t) => {
      const done = rec?.tasks?.includes(t.id) || (t.id === 'checkin' && rec?.done);
      const link = taskLink(t);
      const title = link ? `<a href="${esc(link)}">${esc(t.title)}</a>` : esc(t.title);
      return `<li class="${done ? 'done' : ''}">
        <input type="checkbox" data-id="${esc(t.id)}" ${done ? 'checked' : ''} ${t.id === 'checkin' || !isToday ? 'disabled' : ''}>
        <div style="min-width:0"><div class="task-text">${title}</div>${t.detail ? `<div class="task-detail">${esc(t.detail)}</div>` : ''}</div>
        <span class="task-min">${t.minutes} 分钟</span></li>`;
    }).join('')}</ul>
    <p class="muted small" style="margin:10px 0 0">由 ${esc(plan.generator?.model || 'claude')} 生成于 ${new Date(plan.generatedAt).toLocaleString()}${plan.generator?.costUsd != null ? ` · 约 $${plan.generator.costUsd.toFixed(3)}` : ''} · 已固定，不会再变</p>`;
  el.querySelectorAll('input[data-id]').forEach((cb) => (cb.onchange = async () => {
    const set = new Set(recordFor(today())?.tasks || []);
    cb.checked ? set.add(cb.dataset.id) : set.delete(cb.dataset.id);
    try { await upsertToday({ tasks: [...set] }); render(); } catch (e) { fail(e); }
  }));
}

function renderCheckin(track, week) {
  const ci = document.getElementById('checkin');
  const rec = recordFor(viewDate);
  if (!isToday) {
    ci.innerHTML = rec?.done ? `<div class="answer">✓ 当天已打卡（${rec.minutes} 分钟）${rec.note ? '：' + esc(rec.note) : ''}</div>` : '';
    return;
  }
  if (!track || !settings.startDate || week < 1) { ci.innerHTML = ''; return; }
  if (rec?.done) {
    ci.innerHTML = `<div class="answer">✓ 今天已打卡（${rec.minutes} 分钟）${rec.note ? '：' + esc(rec.note) : ''} <button class="btn ghost sm" id="undo">撤销</button></div>`;
    ci.querySelector('#undo').onclick = async () => { try { await upsertToday({ done: false }); render(); } catch (e) { fail(e); } };
    return;
  }
  const planned = plan ? plan.tasks.reduce((s, t) => s + t.minutes, 0) : 30;
  ci.innerHTML = `<div class="fields" style="grid-template-columns:100px minmax(0,1fr) auto;align-items:end">
    <div class="field"><label>分钟</label><input type="number" id="ci-min" min="1" value="${rec?.minutes || planned}"></div>
    <div class="field"><label>一句话记录（可选）</label><input type="text" id="ci-note" value="${esc(rec?.note || '')}"></div>
    <button class="btn ok" id="ci-btn">打卡</button>
  </div>`;
  ci.querySelector('#ci-btn').onclick = async () => {
    try {
      await upsertToday({ done: true, minutes: Number(ci.querySelector('#ci-min').value) || 0, note: ci.querySelector('#ci-note').value.trim(), track: track || null });
      toast('打卡成功');
      render();
    } catch (e) { fail(e); }
  };
}

function renderReading() {
  const card = document.getElementById('reading-card');
  card.classList.toggle('hidden', !material);
  if (!material) return;
  const done = reading.some((r) => r.planDate === viewDate);
  const task = plan?.tasks.find((t) => t.link.startsWith('reading.html'));
  const href = isToday && task ? planLink('reading.html#today', task.id) : `reading.html?date=${viewDate}#today`;
  card.innerHTML = `
    <div class="row"><h3 style="margin:0">今日阅读：${esc(material.title)}</h3>
      <span class="badge ${material.track}">${esc(material.level)}</span>
      <span class="muted small">${material.wordCount} 词${material.sourceName ? ' · ' + esc(material.sourceName) : ''}</span></div>
    ${material.why ? `<p class="muted small" style="margin:8px 0 0">${esc(material.why)}</p>` : ''}
    <div class="row" style="margin-top:12px">
      <a class="btn ${done ? '' : 'primary'}" href="${href}">${done ? '查看' : '去读 →'}</a>
      ${done ? '<span class="badge ok">✓ 已读并记录</span>' : ''}
    </div>`;
}

function renderWriting() {
  const card = document.getElementById('writing-card');
  const w = plan?.writing;
  card.classList.toggle('hidden', !w);
  if (!w) return;
  const wTask = isToday && plan.tasks.find((t) => t.link.startsWith('writing.html') || t.link.startsWith('prompts.html'));
  card.innerHTML = `<h3 style="margin-top:0">今日写作 / 闲聊</h3>
    <p style="white-space:pre-wrap">${esc(w.prompt)}</p>
    ${w.hints.length ? `<div class="small muted">可以套用：</div><ul>${w.hints.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}
    <a class="btn" href="${wTask ? planLink('writing.html#journal', wTask.id) : 'writing.html#journal'}">去写作日志 →</a> <a class="btn ghost" href="prompts.html">AI 陪练</a>`;
}

function renderSide(week, phase) {
  const doneDays = checkins.filter((c) => c.done);
  const stat = (num, label) => `<div class="card stat"><div class="num">${num}</div><div class="label">${label}</div></div>`;
  document.getElementById('stats').innerHTML =
    stat(workdayStreak(doneDays.map((c) => c.date)), '连续打卡（工作日）') +
    stat(doneDays.length, '累计打卡') +
    stat(`${words.filter((w) => w.known).length}<span class="muted small"> / ${words.length}</span>`, '熟词 / 生词') +
    stat(`${reading.length}<span class="muted small"> · ${journal.length}</span>`, '阅读 · 写作');

  const pct = week && week > 0 ? Math.min(100, Math.round((Math.min(week, 24) / 24) * 100)) : 0;
  document.getElementById('phase').innerHTML = `
    <div class="bar" style="margin-bottom:12px"><div style="width:${pct}%"></div></div>
    ${PHASES.map((p) => `<div style="margin-bottom:8px">
      <div class="row"><b>阶段 ${p.n} · ${esc(p.name)}</b><span class="muted small">第 ${p.from}–${p.to} 周</span>
      ${phase && phase.n === p.n && week <= 24 ? '<span class="badge tech">当前</span>' : ''}</div>
      <div class="muted small">结束标准：${esc(p.goal)}</div>
    </div>`).join('')}
    <a class="small" href="progress.html#phases">去进度页登记阶段达成 →</a>`;
}

async function loadHistory() {
  const el = document.getElementById('history');
  try {
    const list = await (await fetch('/api/english/plans')).json();
    el.innerHTML = list.length
      ? `<ul class="tasks">${list.slice(0, 15).map((p) => `<li style="padding:6px 0">
          <a href="?date=${p.date}" style="white-space:nowrap">${p.date} ${WEEKDAYS[parseYmd(p.date).getDay()]}</a>
          <span class="muted" style="min-width:0">${esc(p.focus)}</span></li>`).join('')}</ul>`
      : '<span class="muted">还没有生成过计划。</span>';
  } catch { el.innerHTML = '<span class="muted">读取失败。</span>'; }
}

function render() {
  const d = parseYmd(viewDate);
  const track = TRACK_BY_DAY[d.getDay()];
  const week = weekNumber(settings.startDate, d);
  const phase = phaseOf(week);

  document.getElementById('setup').classList.toggle('hidden', !!settings.startDate);
  document.getElementById('back-today').classList.toggle('hidden', isToday);
  document.getElementById('date-title').textContent = `${viewDate} ${WEEKDAYS[d.getDay()]}`;
  document.getElementById('track-badge').innerHTML = track
    ? `<span class="badge ${track}">${TRACK_LABEL[track]}</span>`
    : '<span class="badge">休息日</span>';
  const weekLine = document.getElementById('week-line');
  if (!settings.startDate) weekLine.textContent = '设置开始日期后生成每天的计划。';
  else if (week < 1) weekLine.textContent = `计划从 ${settings.startDate} 那一周开始。`;
  else weekLine.textContent = `第 ${week} 周 · 阶段 ${phase.n}「${phase.name}」${week > 24 ? ' · 24 周计划已走完，继续保持' : ''}`;

  renderPlan(track, week);
  renderCheckin(track, week);
  renderReading();
  renderWriting();
  renderSide(week, phase);
}

// Today's plan is generated automatically the first time the page is opened on a workday.
function maybeGenerate() {
  const d = parseYmd(viewDate);
  if (isToday && !plan && planState !== 'loading' && TRACK_BY_DAY[d.getDay()] && weekNumber(settings.startDate, d) >= 1) generatePlan();
}

const startInput = document.getElementById('start');
startInput.value = today();
document.getElementById('save-start').onclick = async () => {
  if (!startInput.value) return;
  settings.startDate = startInput.value;
  try {
    await save('settings', settings);
    toast('开始！');
    render();
    maybeGenerate();
  } catch (e) { fail(e); }
};

try {
  [settings, checkins, words, reading, journal] = await Promise.all(['settings', 'checkins', 'words', 'reading', 'journal'].map(load));
  [plan, material] = await Promise.all([fetchPlan(viewDate), fetchMaterial(viewDate)]);
  planState = plan ? 'ready' : 'idle';
  render();
  loadHistory();
  maybeGenerate();
} catch (e) { fail(e); }
</script>
</body>
</html>
