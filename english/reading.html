<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English · 阅读</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 2px 10px; border-radius: 999px; background: var(--surface-2); font-size: .88rem; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; padding: 0; list-style: none; font-size: .86rem; }
  .steps li { padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .steps li.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .steps li.ok { background: var(--ok-soft); color: var(--ok); }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <h1>阅读</h1>
    <p>材料每天由系统挑选：按你走的线、阶段，以及你读的时候标出的生词来定难度和篇幅。</p>
  </div>

  <div class="tabs">
    <button data-tab="today">今日材料</button>
    <button data-tab="log">记录</button>
    <button data-tab="vocab">词汇量</button>
  </div>

  <section data-panel="today"><div id="today"></div></section>

  <section data-panel="log">
    <div class="card" style="margin-bottom:16px">
      <div class="row" style="margin-bottom:10px"><h3 style="margin:0">阅读记录</h3><span class="spacer"></span><span class="muted small" id="count"></span></div>
      <div class="table-wrap"><table id="table"></table></div>
    </div>
    <details class="card">
      <summary style="cursor:pointer"><b>额外读了别的？记一笔（可选）</b></summary>
      <div style="margin-top:12px">
        <div class="fields" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
          <div class="field"><label>标题</label><input type="text" id="x-title"></div>
          <div class="field"><label>链接（可选）</label><input type="url" id="x-url"></div>
        </div>
        <div class="fields">
          <div class="field"><label>线</label><select id="x-track"><option value="tech">技术</option><option value="daily">日常</option></select></div>
          <div class="field"><label>懂了多少：<b id="x-pct-v">70%</b></label><input type="range" id="x-pct" min="0" max="100" step="10" value="70" style="width:100%"></div>
        </div>
        <div class="field"><label>一句话英文总结</label><input type="text" id="x-summary"></div>
        <button class="btn primary" id="x-add">保存</button>
      </div>
    </details>
  </section>

  <section data-panel="vocab"><div id="vocab"></div></section>
</main>
<script type="module">
import { esc, today, uid, toast, copy, tabs, fail, beginAI } from '/assets/app.js';
import { header, load, save, addWordDialog } from './js/common.js';
import { TRACK_BY_DAY } from './js/plan.js';
import { tokenize, wordsOf, lexiconProfile } from './js/lexicon.js';
import { PROMPTS } from './content/prompts.js';

header('reading');
tabs(document.querySelector('main'));

const date = new URLSearchParams(location.search).get('date') || today();
let reading = [];
let words = [];
let material = null;
const DRAFT_KEY = `reading-draft-${date}`;
let draft = { unknown: [], finished: false };
try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY)) || draft; } catch {}
const saveDraft = () => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch {} };

const recordOf = () => reading.find((r) => r.planDate === date);
const trackLabel = (t) => (t === 'tech' ? '技术' : '日常');

// The sentence of `text` containing `word`, saved with the word as its context.
function sentenceWith(text, word) {
  const sentences = text.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+["')\]]*/g) || [text];
  const re = new RegExp(`\\b${word.split(/[\s/]+/)[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i');
  return (sentences.find((s) => re.test(s)) || '').trim();
}

function stats(unknownList) {
  const all = wordsOf(material.text);
  const set = new Set(unknownList);
  const hits = all.filter((w) => set.has(w)).length;
  return { wordCount: all.length, distinct: [...new Set(all)], unknownRatio: all.length ? Math.round((hits / all.length) * 1000) / 10 : 0 };
}

// ---------- today's material ----------

function renderToday() {
  const el = document.getElementById('today');
  const previousRecord = recordOf();
  const form = el.querySelector('#r-summary');
  if (!previousRecord && form) {
    draft.form = Object.fromEntries(['r-pct', 'r-min', 'r-summary', 'r-hard'].map(id => [id, el.querySelector('#' + id)?.value || '']));
  }
  const feedbackDraft = previousRecord && el.querySelector('#fb-text')?.value;
  const openAnswers = [...el.querySelectorAll('[data-qa]')].filter(b => !el.querySelector('#qa-' + b.dataset.qa)?.classList.contains('hidden')).map(b => b.dataset.qa);
  if (!material) {
    el.innerHTML = `<div class="card empty">${date === today()
      ? '今天的材料还没有生成。它会和今日计划一起生成——先去<a href="./">今日</a>页。'
      : '这一天没有阅读材料。'}</div>`;
    return;
  }
  const rec = recordOf();
  const unknown = rec ? rec.unknown : draft.unknown;
  const finished = !!rec || draft.finished;
  const st = stats(unknown);
  const unknownSet = new Set(unknown);
  const have = new Set(words.map((w) => w.word.trim().toLowerCase()));

  const passage = material.text.split(/\n\s*\n/).map((para) => `<p>${tokenize(para).map((t) =>
    t.w ? `<span class="w ${unknownSet.has(t.w) ? 'unknown' : ''}" data-w="${esc(t.w)}">${esc(t.t)}</span>` : esc(t.t)).join('')}</p>`).join('');

  el.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div class="row">
        <h2 style="margin:0">${esc(material.title)}</h2>
        <span class="badge ${material.track}">${trackLabel(material.track)} · ${esc(material.level)}</span>
        <span class="muted small">${st.wordCount} 词${material.sourceName ? ` · ${material.kind === 'excerpt' ? '原文节选自' : material.kind === 'adapted' ? '改编自' : ''} ${esc(material.sourceName)}` : ''}</span>
        ${material.sourceUrl ? `<a class="small" href="${esc(material.sourceUrl)}" target="_blank" rel="noopener">原文出处 ↗</a>` : ''}
      </div>
      ${material.why ? `<p class="muted small" style="margin:8px 0 0">为什么选这篇：${esc(material.why)}</p>` : ''}
      ${material.focus ? `<p class="small" style="margin:4px 0 0">读的时候注意：${esc(material.focus)}</p>` : ''}
    </div>

    <div class="card" style="margin-bottom:16px">
      <ol class="steps">
        <li class="${finished ? 'ok' : 'on'}">1 通读，点出不认识的词</li>
        <li class="${rec ? 'ok' : finished ? 'on' : ''}">2 看生词表、做理解题</li>
        <li class="${rec ? 'ok' : ''}">3 记录</li>
      </ol>
      <p class="muted small" style="margin-bottom:6px">${finished
        ? `标了 <b>${unknown.length}</b> 个生词，占全文 <b>${st.unknownRatio}%</b>（舒服的阅读在 2%–5% 左右）。`
        : '第一遍不查词，不翻译。遇到不认识的词就点一下（再点取消），这些标记用来估计你的词汇量、决定之后材料的难度。'}</p>
      <div class="passage" id="passage">${passage}</div>
      ${finished ? '' : `<div class="row" style="margin-top:8px"><button class="btn primary" id="finish">读完了，看生词表和理解题</button><span class="muted small" id="mark-count">已标 ${unknown.length} 个</span></div>`}
    </div>

    ${finished ? `
    <div class="grid grid-2" style="margin-bottom:16px">
      <div class="card">
        <h3>生词表</h3>
        <div class="table-wrap"><table>${material.glossary.map((g, i) => `<tr>
          <td><b>${esc(g.word)}</b></td><td>${esc(g.meaning)}</td>
          <td style="text-align:right">${have.has(g.word.trim().toLowerCase()) ? '<span class="badge ok">已在生词本</span>' : `<button class="btn sm" data-gl="${i}">加入</button>`}</td>
        </tr>`).join('')}</table></div>
        ${unknown.length ? `<h3>你标的生词</h3><div class="chips">${unknown.map((w) =>
          have.has(w) ? `<span class="chip">${esc(w)} ✓</span>` : `<button class="chip warn" style="border:0;cursor:pointer" data-uw="${esc(w)}">${esc(w)} +</button>`).join('')}</div>
          <p class="muted small" style="margin-top:6px">点一下加入生词本（只加会再遇到的）。</p>` : ''}
      </div>
      <div class="card">
        <h3>理解题</h3>
        ${material.questions.map((q, i) => `<div class="exercise"><div class="q"><b>${i + 1}.</b> ${esc(q.q)}</div>
          <button class="btn sm" data-qa="${i}">看答案</button><div class="answer hidden" id="qa-${i}">${esc(q.a)}</div></div>`).join('')}
      </div>
    </div>

    <div class="card">
      <h3>记录</h3>
      ${rec ? `<p>懂了 <b>${rec.understood}%</b> · 生词 ${rec.unknown.length} 个（${rec.unknownRatio}%）</p>
        ${rec.hard ? `<p><span class="muted small">最难的一句：</span>${esc(rec.hard)}</p>` : ''}
        <div id="feedback">${feedbackHtml(rec)}</div>`
      : `<div class="fields">
          <div class="field"><label>懂了多少：<b id="r-pct-v">70%</b></label><input type="range" id="r-pct" min="0" max="100" step="10" value="70" style="width:100%"></div>
          <div class="field"><label>用了几分钟</label><input type="number" id="r-min" min="1" value="10"></div>
        </div>
        <div class="field"><label>一句话英文总结</label><input type="text" id="r-summary"></div>
        <div class="field"><label>最难的一句（从上文复制，保存后 AI 会解析结构和句意）</label><textarea id="r-hard" rows="2"></textarea></div>
        <div class="row"><button class="btn primary" id="r-save">保存记录</button>
          <button class="btn" id="r-parse">复制"拆长句"提示词</button>
          <button class="btn ghost" id="r-back">重新标生词</button></div>`}
    </div>` : ''}`;

  if (!rec && draft.form) {
    for (const [id, value] of Object.entries(draft.form)) {
      const input = el.querySelector('#' + id);
      if (input) input.value = value;
    }
    const percent = el.querySelector('#r-pct');
    if (percent) el.querySelector('#r-pct-v').textContent = percent.value + '%';
  }
  if (rec?.id === previousRecord?.id && feedbackDraft !== undefined && el.querySelector('#fb-text')) el.querySelector('#fb-text').value = feedbackDraft;
  openAnswers.forEach(i => el.querySelector('#qa-' + i)?.classList.remove('hidden'));

  // marking unknown words
  if (!rec) el.querySelectorAll('#passage .w').forEach((s) => (s.onclick = () => {
    const w = s.dataset.w;
    const set = new Set(draft.unknown);
    set.has(w) ? set.delete(w) : set.add(w);
    draft.unknown = [...set];
    saveDraft();
    el.querySelectorAll(`#passage .w[data-w="${CSS.escape(w)}"]`).forEach((x) => x.classList.toggle('unknown', set.has(w)));
    const mc = el.querySelector('#mark-count');
    if (mc) mc.textContent = `已标 ${set.size} 个`;
    if (draft.finished) renderToday();
  }));
  el.querySelector('#finish')?.addEventListener('click', () => { draft.finished = true; saveDraft(); renderToday(); });
  el.querySelector('#r-back')?.addEventListener('click', () => { draft.finished = false; saveDraft(); renderToday(); });
  el.querySelectorAll('[data-qa]').forEach((b) => (b.onclick = () => el.querySelector('#qa-' + b.dataset.qa).classList.toggle('hidden')));

  const addWord = async (word, meaning) => {
    const added = await addWordDialog({ word, meaning, sentence: sentenceWith(material.text, word), source: `阅读：${material.title}` });
    if (added) { words.push(added); renderToday(); }
  };
  el.querySelectorAll('[data-gl]').forEach((b) => (b.onclick = () => { const g = material.glossary[Number(b.dataset.gl)]; addWord(g.word, g.meaning); }));
  el.querySelectorAll('[data-uw]').forEach((b) => (b.onclick = () => {
    const w = b.dataset.uw;
    const g = material.glossary.find((x) => x.word.toLowerCase().split(/[\s/]+/).includes(w));
    addWord(w, g?.meaning || '');
  }));

  const pct = el.querySelector('#r-pct');
  if (pct) pct.oninput = () => (el.querySelector('#r-pct-v').textContent = pct.value + '%');
  el.querySelector('#r-parse')?.addEventListener('click', () => {
    const p = PROMPTS.find((x) => x.id === 'parse');
    copy(p.text.replace(/\{\{[^}]+\}\}/, el.querySelector('#r-hard').value.trim() || '<句子>'));
  });
  bindFeedback(el, rec);
  el.querySelector('#r-save')?.addEventListener('click', async () => {
    if (!el.querySelector('#r-summary').value.trim() && !el.querySelector('#r-hard').value.trim() && !confirm('没有填写英文总结或难句，就不会有 AI 点评。仍然保存？')) return;
    const s = stats(draft.unknown);
    reading.push({
      id: uid(), date: today(), planDate: date, title: material.title, url: material.sourceUrl || '',
      track: material.track, level: material.level, minutes: Number(el.querySelector('#r-min').value) || 0,
      understood: Number(pct.value), summary: el.querySelector('#r-summary').value.trim(), hard: el.querySelector('#r-hard').value.trim(),
      wordCount: s.wordCount, distinct: s.distinct, unknown: draft.unknown, unknownRatio: s.unknownRatio,
    });
    try {
      await save('reading', reading);
      try { localStorage.removeItem(DRAFT_KEY); } catch {}
      draft.form = null;
      toast('已记入阅读记录');
      renderToday(); renderLog(); renderVocab();
      const saved = reading.at(-1);
      if (saved.summary || saved.hard) requestFeedback(saved.id, saved.summary);
    } catch (e) { reading.pop(); fail(e); }
  });
}

// ---------- feedback on the summary ----------

let fb = { state: 'idle', error: '', id: null }; // state: idle | loading | error

function feedbackHtml(rec) {
  const attempts = rec.summaryAttempts || [];
  const last = attempts.at(-1);
  const loading = fb.state === 'loading' && fb.id === rec.id;
  const LEVEL = { 准确: 'ok', 基本准确: 'tech', 偏离: 'warn' };
  let html = '';
  if (rec.summary && !last) html += `<p><span class="muted small">你的总结：</span>${esc(rec.summary)}</p>`;
  if (last?.summary) {
    const f = last.feedback;
    html += `<div class="row" style="margin:12px 0 6px"><h3 style="margin:0">总结点评</h3><span class="badge ${LEVEL[f.understanding.level] || ''}">理解：${esc(f.understanding.level)}</span>
        ${attempts.length > 1 ? `<span class="muted small">第 ${attempts.length} 版</span>` : ''}</div>
      <p style="margin-bottom:6px"><span class="muted small">你写的：</span>${esc(last.summary)}</p>
      <p class="small">${esc(f.understanding.comment)}</p>
      ${f.corrections.length ? `<div class="table-wrap"><table>
          <tr><th>原来</th><th>改成</th><th>为什么</th></tr>
          ${f.corrections.map((c) => `<tr><td><s class="muted">${esc(c.original)}</s></td><td><b>${esc(c.corrected)}</b></td><td class="small">${esc(c.explanation)}</td></tr>`).join('')}
        </table></div>` : '<p class="small"><span class="badge ok">语言上没有错误</span></p>'}
      <p style="margin-bottom:4px"><span class="muted small">改正后：</span>${esc(f.corrected)}</p>
      <p style="margin-bottom:4px"><span class="muted small">更地道的写法：</span><b>${esc(f.better)}</b></p>
      <div class="answer">记住：${esc(f.tip)}</div>
      <div class="row" style="margin-top:10px">
        ${last.savedToJournal ? '<span class="badge ok">✓ 已存进写作日志</span>' : '<button class="btn sm" id="fb-journal">存进写作日志</button>'}
      </div>`;
  }
  const analysis = last?.feedback?.sentenceAnalysis;
  if (rec.hard && analysis?.mainClause) {
    html += `<div class="card" style="margin-top:16px"><h3 style="margin-top:0">最难一句解析</h3>
      <p style="white-space:pre-wrap">${esc(analysis.sentence || rec.hard)}</p>
      <p><b>句子主干：</b>${esc(analysis.mainClause)}</p>
      <b>逐段拆解</b><ol>${(analysis.parts || []).map(part => `<li><code>${esc(part.text)}</code> · ${esc(part.role)}：${esc(part.explanation)}</li>`).join('')}</ol>
      <p><b>整句意思：</b>${esc(analysis.naturalMeaning)}</p>
      <p><b>阅读要点：</b>${esc(analysis.readingTip)}</p></div>`;
  }
  if (loading) {
    html += `<div class="row" style="padding:12px 0;flex-wrap:nowrap"><div class="spinner"></div><span>正在请本地 AI 点评并解析难句……通常 20–40 秒。</span></div>`;
  } else if (fb.state === 'error' && fb.id === rec.id) {
    html += `<div class="banner" style="border-radius:8px;text-align:left;margin-top:8px">点评失败：${esc(fb.error)}</div>
      <button class="btn sm" id="fb-retry" style="margin-top:8px">重试</button>`;
  } else if (rec.summary) {
    if (rec.hard && last && !analysis?.mainClause) html += '<button class="btn sm primary" id="fb-analyze" style="margin-top:12px">解析已摘出的难句</button>';
    html += `<details style="margin-top:12px" ${last ? '' : 'open'}><summary class="small" style="cursor:pointer">${last ? '照着点评改写，再评一次' : '请 AI 点评总结并解析难句'}</summary>
      <div class="field" style="margin-top:8px"><textarea id="fb-text" rows="2">${esc(last ? '' : rec.summary)}</textarea></div>
      <button class="btn sm primary" id="fb-send">${last ? '再评一次' : '点评'}</button></details>`;
  } else if (rec.hard) {
    html += `<button class="btn sm primary" id="fb-send" style="margin-top:12px">${analysis?.mainClause ? '重新解析难句' : '解析难句'}</button>`;
  } else {
    html += `<div class="field" style="margin-top:8px"><label>补一句英文总结，让 AI 点评</label><textarea id="fb-text" rows="2"></textarea></div>
      <button class="btn sm primary" id="fb-send">点评</button>`;
  }
  return html + '<p style="margin-top:12px"><span class="badge ok">✓ 已记入阅读记录</span></p>';
}

function bindFeedback(el, rec) {
  if (!rec) return;
  el.querySelector('#fb-retry')?.addEventListener('click', () => requestFeedback(rec.id, fb.summary));
  el.querySelector('#fb-analyze')?.addEventListener('click', () => requestFeedback(rec.id, rec.summary));
  el.querySelector('#fb-send')?.addEventListener('click', () => {
    const text = el.querySelector('#fb-text')?.value.trim() || '';
    if (!text && !rec.hard) return toast('先写一句英文总结');
    requestFeedback(rec.id, text);
  });
  el.querySelector('#fb-journal')?.addEventListener('click', async () => {
    const last = rec.summaryAttempts.at(-1);
    try {
      const journal = await load('journal');
      journal.push({ id: uid(), date: today(), track: rec.track, original: last.summary, corrected: last.feedback.corrected, learned: last.feedback.tip });
      await save('journal', journal);
      last.savedToJournal = true;
      await save('reading', reading);
      toast('已存进写作日志');
      renderToday();
    } catch (e) { fail(e); }
  });
}

async function requestFeedback(id, summary) {
  fb = { state: 'loading', error: '', id, summary };
  renderToday();
  const finishAI = beginAI('AI 正在点评阅读并解析难句');
  try {
    const r = await fetch('/api/english/summary-feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, summary }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || `点评失败：${r.status}`);
    // The server stored the feedback in reading.json; take its copy of the record.
    reading = reading.map((x) => (x.id === id ? body : x));
    finishAI();
    fb = { state: 'idle', error: '', id: null };
  } catch (e) {
    finishAI(e);
    fb = { state: 'error', error: e.message, id, summary };
  }
  renderToday(); renderLog();
}

// ---------- log ----------

function renderLog() {
  document.getElementById('count').textContent = `共 ${reading.length} 篇`;
  const list = reading.slice().reverse();
  document.getElementById('table').innerHTML = list.length
    ? '<tr><th>日期</th><th>材料</th><th>线 / 级别</th><th>生词</th><th>懂了</th><th>总结</th><th></th></tr>' +
      list.map((r) => `<tr>
        <td class="small muted">${r.date}</td>
        <td>${r.planDate ? `<a href="?date=${r.planDate}#today">${esc(r.title)}</a>` : r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>` : esc(r.title)}${r.hard ? `<div class="small muted">难句：${esc(r.hard)}</div>` : ''}</td>
        <td><span class="badge ${r.track}">${trackLabel(r.track)}</span> ${esc(r.level || '')}</td>
        <td>${r.unknownRatio != null ? `${r.unknown.length}（${r.unknownRatio}%）` : '—'}</td>
        <td>${r.understood}%</td>
        <td>${esc(r.summary || '')}${r.summaryAttempts?.length ? `<div class="small muted">点评：${esc(r.summaryAttempts.at(-1).feedback.understanding.level)} · ${esc(r.summaryAttempts.at(-1).feedback.corrected)}</div>` : ''}</td>
        <td><button class="btn ghost sm" data-del="${r.id}">删除</button></td>
      </tr>`).join('')
    : '<tr><td class="empty">还没有阅读记录。</td></tr>';
  document.querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
    if (!confirm('删除这条记录？')) return;
    reading = reading.filter((r) => r.id !== b.dataset.del);
    try { await save('reading', reading); } catch (e) { fail(e); }
    renderLog(); renderVocab(); renderToday();
  }));
}

const X = (id) => document.getElementById('x-' + id);
X('track').value = TRACK_BY_DAY[new Date().getDay()] || 'tech';
X('pct').oninput = () => (X('pct-v').textContent = X('pct').value + '%');
X('add').onclick = async () => {
  const title = X('title').value.trim();
  if (!title) return toast('先填标题');
  reading.push({ id: uid(), date: today(), title, url: X('url').value.trim(), track: X('track').value, level: '', minutes: 0, understood: Number(X('pct').value), summary: X('summary').value.trim(), hard: '' });
  ['title', 'url', 'summary'].forEach((k) => (X(k).value = ''));
  try { await save('reading', reading); toast('已保存'); } catch (e) { fail(e); }
  renderLog();
};

// ---------- vocabulary ----------

function renderVocab() {
  const { known, unknown, sessions } = lexiconProfile(reading);
  const el = document.getElementById('vocab');
  if (!sessions.length) {
    el.innerHTML = '<div class="card empty">读完第一篇材料并保存记录后，这里会显示你的词汇量情况。</div>';
    return;
  }
  const last = sessions.slice(-5);
  const avg = Math.round((last.reduce((s, x) => s + x.unknownRatio, 0) / last.length) * 10) / 10;
  const stat = (num, label) => `<div class="card stat"><div class="num">${num}</div><div class="label">${label}</div></div>`;
  el.innerHTML = `
    <div class="grid grid-4" style="margin-bottom:16px">
      ${stat(known.size, '读到且认识的不同词')}
      ${stat(unknown.size, '目前标为不认识的词')}
      ${stat(`${avg}%`, `近 ${last.length} 篇平均生词率`)}
      ${stat(sessions.length, '标过生词的材料')}
    </div>
    <div class="card" style="margin-bottom:16px">
      <p class="muted small" style="margin:0">生词率在 2%–5% 读起来最舒服，也学得最多；高于 8% 之后的材料会变简单变短，低于 2% 且懂得多就会加难度。一个词标过不认识、之后在新材料里读到时没再标，就算认识了。</p>
    </div>
    <div class="grid grid-2">
      <div class="card"><h3>每篇的生词率</h3><div class="table-wrap"><table>
        <tr><th>日期</th><th>材料</th><th>词数</th><th>生词率</th><th>懂了</th></tr>
        ${sessions.slice().reverse().map((x) => `<tr><td class="small muted">${x.date}</td><td>${esc(x.title)} <span class="badge ${x.track}">${esc(x.level || '')}</span></td>
          <td>${x.wordCount}</td><td>${x.unknownRatio}%</td><td>${x.understood}%</td></tr>`).join('')}
      </table></div></div>
      <div class="card"><h3>目前不认识的词</h3>
        ${unknown.size ? `<div class="chips">${[...unknown].map((w) => `<span class="chip warn">${esc(w)}</span>`).join('')}</div>` : '<p class="muted">没有。</p>'}
      </div>
    </div>`;
}

try {
  [reading, words] = await Promise.all([load('reading'), load('words')]);
  material = await (await fetch(`/api/english/material?date=${date}`)).json();
  renderToday(); renderLog(); renderVocab();
} catch (e) { fail(e); }
</script>
</body>
