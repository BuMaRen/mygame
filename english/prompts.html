<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English · AI 陪练</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  .coach-history { display: grid; gap: 10px; max-height: 520px; overflow-y: auto; padding: 4px 2px 12px; }
  .coach-turn { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .coach-turn.user { background: var(--accent-soft); }
  .coach-turn.assistant { background: var(--surface-2); }
  .coach-turn b { display: block; margin-bottom: 5px; }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <h1>AI 陪练</h1>
    <p>选一个练习，直接在页面里用英文写、问、聊。AI 会继续对话或给出具体反馈；练习记录会保存，方便回来接着练。</p>
  </div>
  <div class="row" style="margin-bottom:14px">
    <span class="muted small">显示：</span>
    <button class="btn sm" data-filter="all">全部</button>
    <button class="btn sm" data-filter="daily">日常</button>
    <button class="btn sm" data-filter="tech">技术</button>
  </div>
  <div class="grid grid-2" id="list"></div>
  <section class="card hidden" id="coach-panel" style="margin-top:18px"></section>
</main>
<script type="module">
import { esc, toast, fail, beginAI } from '/assets/app.js';
import { header, load, save } from './js/common.js';
import { PROMPTS } from './content/prompts.js';

header('prompts');
const SLOT = /\{\{([^|}]+)(?:\|([^}]*))?\}\}/g;
const TRACK = { tech: ['tech', '技术'], daily: ['daily', '日常'], both: ['', '通用'] };
const drafts = new Map(), openingDrafts = new Map(), messageDrafts = new Map();
let filter = 'all', state = { sessions: {} }, activeId = null, renderedPanelId = null, busyId = null, error = '';
const sessionOf = id => state.sessions[id];
const fieldValues = card => [...card.querySelectorAll('.template-field')].map(input => input.value.trim());

function renderList() {
  document.querySelectorAll('#list [data-id]').forEach(card => drafts.set(card.dataset.id, fieldValues(card)));
  document.querySelectorAll('#list [data-id]').forEach(card => openingDrafts.set(card.dataset.id, card.querySelector('.opening').value));
  document.querySelectorAll('[data-filter]').forEach(button => button.classList.toggle('primary', button.dataset.filter === filter));
  const list = PROMPTS.filter(p => filter === 'all' || p.track === filter || p.track === 'both');
  const el = document.getElementById('list');
  el.innerHTML = list.map(p => {
    const [cls, label] = TRACK[p.track];
    const fields = [...p.text.matchAll(SLOT)];
    return `<div class="card" data-id="${p.id}">
      <div class="row"><h3 style="margin:0">${esc(p.title)}</h3><span class="badge ${cls}">${label}</span></div>
      <p class="muted small" style="margin:6px 0 10px">${esc(p.use)}</p>
      ${fields.map(([, name, hint]) => `<div class="field"><label>${esc(name)}</label>${/段落|句子|英文/.test(name)
        ? `<textarea class="template-field" rows="2" placeholder="${esc(hint || '')}"></textarea>`
        : `<input class="template-field" type="text" placeholder="${esc(hint || '')}">`}</div>`).join('')}
      <div class="field"><label>第一句（可选，留空则由 AI 开启话题）</label><textarea class="opening" rows="2" placeholder="例如：I want to talk about my work today."></textarea></div>
      <button class="btn primary open">${sessionOf(p.id) ? '继续练习' : '开始练习'}</button>
      ${sessionOf(p.id) ? `<span class="muted small" style="margin-left:8px">已保存 ${sessionOf(p.id).messages.length} 条对话</span>` : ''}
    </div>`;
  }).join('');
  el.querySelectorAll('[data-id]').forEach(card => {
    const id = card.dataset.id;
    const values = drafts.get(id) || sessionOf(id)?.values || [];
    [...card.querySelectorAll('.template-field')].forEach((input, i) => { input.value = values[i] || ''; });
    card.querySelector('.opening').value = openingDrafts.get(id) || '';
    card.querySelector('.open').onclick = async () => {
      const opening = card.querySelector('.opening').value.trim();
      if (!sessionOf(id)) {
        state.sessions[id] = { values: fieldValues(card), messages: [], updatedAt: new Date().toISOString() };
        try { await save('coaching', state); } catch (e) { delete state.sessions[id]; return fail(e); }
      } else if (!sessionOf(id).messages.length) {
        const previous = sessionOf(id).values;
        sessionOf(id).values = fieldValues(card);
        try { await save('coaching', state); } catch (e) { sessionOf(id).values = previous; return fail(e); }
      }
      activeId = id; error = ''; renderPanel(); renderList();
      document.getElementById('coach-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (!sessionOf(id).messages.length) sendTurn(id, opening);
    };
  });
}

function renderPanel() {
  const panel = document.getElementById('coach-panel');
  if (renderedPanelId && panel.querySelector('#coach-input')) messageDrafts.set(renderedPanelId, panel.querySelector('#coach-input').value);
  const template = PROMPTS.find(p => p.id === activeId), session = sessionOf(activeId);
  renderedPanelId = activeId;
  panel.classList.toggle('hidden', !template || !session);
  if (!template || !session) { panel.innerHTML = ''; return; }
  const messages = session.messages || [];
  const last = messages.at(-1);
  panel.innerHTML = `<div class="row"><h2 style="margin:0">${esc(template.title)}</h2><span class="spacer"></span>
    <button class="btn ghost sm" id="coach-clear" ${busyId ? 'disabled' : ''}>清空这项练习</button></div>
    <p class="muted small">直接在这里继续练习。切换题目后，对话仍会保留。${last?.model ? ` · ${esc(last.model)}` : ''}</p>
    <div class="coach-history" id="coach-history" aria-live="polite">${messages.length ? messages.map(m => `<div class="coach-turn ${m.role}"><b>${m.role === 'user' ? '你' : 'AI'}</b>${esc(m.content)}${m.suggestedRevision ? `<p><b>改正后：</b>${esc(m.suggestedRevision)}</p>` : ''}</div>`).join('') : '<p class="muted">AI 默认开启话题；你也可以先写第一句。</p>'}</div>
    ${busyId === activeId ? '<p class="muted small">AI 正在回复…</p>' : ''}
    ${error ? `<div class="banner" style="text-align:left;margin:10px 0">${esc(error)}</div>` : ''}
    ${messages.length ? `<div class="field"><label for="coach-input">你的回复</label><textarea id="coach-input" rows="3" placeholder="用英文写你的想法或回答"></textarea></div>
      <button class="btn primary" id="coach-send" ${busyId || messages.length >= 40 ? 'disabled' : ''}>发送</button>
      ${messages.length >= 40 ? '<span class="muted small">这轮对话已满，可清空后开始新练习。</span>' : ''}`
      : `<div class="field"><label for="coach-input">第一句（可选）</label><textarea id="coach-input" rows="2" placeholder="留空由 AI 开启话题；填写后由你先说"></textarea></div><button class="btn primary" id="coach-start" ${busyId ? 'disabled' : ''}>开始练习</button>`}`;
  const input = panel.querySelector('#coach-input');
  if (input) input.value = messageDrafts.get(activeId) || '';
  panel.querySelector('#coach-history').scrollTop = panel.querySelector('#coach-history').scrollHeight;
  panel.querySelector('#coach-send')?.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) return toast('先写一句英文或你的问题');
    sendTurn(activeId, text);
  });
  panel.querySelector('#coach-start')?.addEventListener('click', () => sendTurn(activeId, input.value.trim()));
  panel.querySelector('#coach-clear').onclick = async () => {
    if (!confirm(`清空「${template.title}」的全部对话并重新开始？`)) return;
    const old = state.sessions[activeId];
    delete state.sessions[activeId];
    try { await save('coaching', state); }
    catch (e) { state.sessions[activeId] = old; return fail(e); }
    drafts.delete(activeId); messageDrafts.delete(activeId); activeId = null; error = '';
    renderPanel(); renderList(); toast('练习已清空');
  };
}

async function sendTurn(id, text = '') {
  if (busyId) return;
  const session = sessionOf(id);
  if (!session) return;
  const messages = text ? [...session.messages, { role: 'user', content: text }] : [...session.messages];
  busyId = id; error = ''; renderPanel();
  const finishAI = beginAI('AI 正在回复英语陪练');
  try {
    const res = await fetch('/api/english/coach', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ templateId: id, values: session.values, messages: messages.map(({ role, content }) => ({ role, content })) }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `AI 请求失败：${res.status}`);
    session.messages = [...messages, { role: 'assistant', content: data.reply, suggestedRevision: data.suggestedRevision, model: data.model }];
    session.updatedAt = new Date().toISOString();
    await save('coaching', state);
    finishAI();
    if (text && activeId === id) {
      const input = document.getElementById('coach-input');
      if (input?.value.trim() === text) input.value = '';
      messageDrafts.set(id, input?.value || '');
    }
    renderList();
  } catch (e) { finishAI(e); error = e.message; }
  finally { busyId = null; if (activeId === id) renderPanel(); }
}

document.querySelectorAll('[data-filter]').forEach(button => button.onclick = () => { filter = button.dataset.filter; renderList(); });
try { state = await load('coaching'); state.sessions ||= {}; renderList(); }
catch (e) { fail(e); }
</script>
</body>
</html>
