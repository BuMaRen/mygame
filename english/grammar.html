<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English · 语法</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>阅读用语法</h1>
    <p>只有 8 课，目标是读的时候认得出结构，不是背规则。先写自己的答案，再看参考答案。</p>
  </div>
  <div class="with-side">
    <nav class="side card" id="side" style="padding:8px"></nav>
    <article class="card" id="lesson"></article>
  </div>
</main>
<script type="module">
import { esc, toast, fail } from '/assets/app.js';
import { header, load, save } from './js/common.js';
import { LESSONS } from './content/grammar.js';

header('grammar');

let state = {};
const entry = (id) => (state[id] ||= { done: false, answers: {}, marks: {} });
const persist = () => save('grammar', state).catch(fail);

function renderSide(current) {
  document.getElementById('side').innerHTML = LESSONS.map((l) =>
    `<a href="#${l.id}" class="${l.id === current ? 'active' : ''}"><span class="num">${l.id}</span>${esc(l.title)}${state[l.id]?.done ? ' <span class="badge ok" style="margin-left:auto">✓</span>' : ''}</a>`
  ).join('');
}

function render() {
  const id = LESSONS.some((l) => l.id === location.hash.slice(1)) ? location.hash.slice(1) : LESSONS[0].id;
  const idx = LESSONS.findIndex((l) => l.id === id);
  const l = LESSONS[idx];
  const e = entry(id);
  renderSide(id);

  const el = document.getElementById('lesson');
  el.innerHTML = `
    <div class="row"><h2 style="margin:0">${l.id} ${esc(l.title)}</h2><span class="muted small">${esc(l.summary)}</span></div>
    <div style="margin-top:14px">${l.body}</div>

    <h3>练习：${esc(l.task)}</h3>
    ${l.exercises.map((x, i) => `
      <div class="exercise" data-i="${i}">
        <div class="q"><b>${i + 1}.</b> ${esc(x.q)}</div>
        <div class="row">
          <input type="text" class="my" placeholder="写下你的答案" value="${esc(e.answers[i] || '')}" style="flex:1;min-width:200px">
          <button class="btn sm reveal">看答案</button>
        </div>
        <div class="answer hidden">
          参考：${esc(x.a)}
          <div class="row" style="margin-top:6px">
            <span class="small muted">我答对了吗？</span>
            <button class="btn sm mark ${e.marks[i] === 'ok' ? 'ok' : ''}" data-v="ok">✓ 对</button>
            <button class="btn sm mark ${e.marks[i] === 'bad' ? 'bad' : ''}" data-v="bad">✗ 不对</button>
          </div>
        </div>
      </div>`).join('')}

    <div class="row" style="margin-top:24px;border-top:1px solid var(--border);padding-top:16px">
      ${idx > 0 ? `<a class="btn" href="#${LESSONS[idx - 1].id}">← ${esc(LESSONS[idx - 1].title)}</a>` : ''}
      <span class="spacer"></span>
      <button class="btn ${e.done ? '' : 'primary'}" id="done">${e.done ? '✓ 已学完（点击取消）' : '标记本课已学完'}</button>
      ${idx < LESSONS.length - 1 ? `<a class="btn" href="#${LESSONS[idx + 1].id}">${esc(LESSONS[idx + 1].title)} →</a>` : ''}
    </div>`;

  el.querySelectorAll('.exercise').forEach((box) => {
    const i = box.dataset.i;
    const input = box.querySelector('.my');
    const ans = box.querySelector('.answer');
    if (e.marks[i]) ans.classList.remove('hidden');
    input.onchange = () => { e.answers[i] = input.value.trim(); persist(); };
    box.querySelector('.reveal').onclick = () => {
      e.answers[i] = input.value.trim();
      ans.classList.remove('hidden');
      persist();
    };
    box.querySelectorAll('.mark').forEach((b) => (b.onclick = () => {
      e.marks[i] = b.dataset.v;
      box.querySelectorAll('.mark').forEach((x) => x.classList.remove('ok', 'bad'));
      b.classList.add(b.dataset.v);
      persist();
    }));
  });

  document.getElementById('done').onclick = async () => {
    e.done = !e.done;
    await persist();
    if (e.done) toast('本课完成 🎉');
    render();
  };
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);
try {
  state = await load('grammar');
  render();
} catch (e) { fail(e); }
</script>
</body>
</html>
