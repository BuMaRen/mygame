<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>算法编码 · practise</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<main>
  <div class="page-head"><h1>算法编码</h1><p>先选类别，再让本地 AI 生成新题。目标是两个月完成约 20–30 道简单和中等题，能稳定写对、解释复杂度并处理边界。</p></div>
  <div class="grid grid-4" id="stats"></div>
  <div class="card" style="margin:16px 0"><b>一次练习：30–40 分钟</b><p class="muted" style="margin:6px 0 0">口述思路 → 限时写 Python → 在本机运行示例和边界输入 → 让 AI 静态评估 → 记录卡点。每周建议 3–4 道新题、1–2 道复练题。</p></div>
  <div class="grid" style="grid-template-columns:minmax(250px,320px) minmax(0,1fr)">
    <aside class="card"><h3 style="margin-top:0">题目类别</h3><div id="categories" class="problem-list"></div></aside>
    <section class="card">
      <div class="row"><div><h2 id="category-name" style="margin:0"></h2><p class="muted small" id="category-description" style="margin:4px 0 0"></p></div><span class="spacer"></span><select id="difficulty" aria-label="新题难度" style="width:auto"><option>简单</option><option>中等</option></select><button class="btn primary" id="generate">AI 生成新题</button></div>
      <div id="question-list" class="coding-question-list"></div>
      <div id="detail"><p class="empty">选择一题，或在这个类别下生成新题。</p></div>
    </section>
  </div>
</main>
<script type="module">
import {topbar,api,esc,today,uid,toast,fail} from '/assets/app.js';
import {CATEGORIES} from './content/categories.js';
topbar({brand:'practise',sub:'算法编码',nav:[{href:'/',label:'总站'},{href:'/system-design/',label:'系统设计'}]});
const skill='coding',categoryEl=document.getElementById('categories'),questionList=document.getElementById('question-list'),detail=document.getElementById('detail');
const labels={new:'未开始',practicing:'练习中',review:'需复练',done:'稳定通过'};
let questions=[],selectedCategory=CATEGORIES[0].id,selectedId=null,started=0,elapsed=0,timer,draftTimer,writeQueue=Promise.resolve();
const current=()=>questions.find(q=>q.id===selectedId);
const inCategory=()=>questions.filter(q=>q.category===selectedCategory);
async function callAI(action,payload){const res=await fetch(`/api/coding/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok)throw new Error(data.error||'AI 请求失败');return data;}
function queueWrite(update){const task=writeQueue.catch(()=>{}).then(async()=>{const next=update(questions);await api.put(skill,'progress',{questions:next});questions=next;});writeQueue=task;return task;}
function patchQuestion(id,patch){return queueWrite(list=>list.map(q=>q.id===id?{...q,...patch}:q));}
function persist(question){return patchQuestion(question.id,question);}
function append(question){return queueWrite(list=>[...list,question]);}
function renderStats(){const num=s=>questions.filter(q=>q.status===s).length;document.getElementById('stats').innerHTML=[[`${questions.length}<span class="small muted"> / 24</span>`,'已生成 / 建议量'],[num('done'),'稳定通过'],[num('review'),'需复练'],[questions.reduce((n,q)=>n+(q.attempts?.length||0),0),'练习次数']].map(([n,l])=>`<div class="card stat"><div class="num">${n}</div><div class="label">${l}</div></div>`).join('');}
function renderCategories(){categoryEl.innerHTML=CATEGORIES.map(c=>`<button class="problem-item ${c.id===selectedCategory?'selected':''}" data-category="${c.id}"><b>${esc(c.name)}</b><span class="small muted">${questions.filter(q=>q.category===c.id).length} 题 · 建议约 ${c.target} 题</span></button>`).join('');categoryEl.querySelectorAll('[data-category]').forEach(b=>b.onclick=async()=>{try{await saveDraft(false);stopTimer();elapsed=0;selectedCategory=b.dataset.category;selectedId=inCategory().at(-1)?.id||null;render();}catch(e){fail(e);}});}
function renderQuestionList(){const list=inCategory().slice().reverse();questionList.innerHTML=list.length?list.map(q=>`<button class="coding-question ${q.id===selectedId?'selected':''}" data-question="${esc(q.id)}"><b>${esc(q.question.title)}</b><span class="small muted">${esc(q.difficulty)} · ${esc(labels[q.status]||'未开始')} · ${esc(q.date)}</span></button>`).join(''):'<p class="muted small" style="margin:0">这个类别还没有题目。可以反复生成不同的新题。</p>';questionList.querySelectorAll('[data-question]').forEach(b=>b.onclick=async()=>{try{await saveDraft(false);stopTimer();elapsed=0;selectedId=b.dataset.question;render();}catch(e){fail(e);}});}
function timeText(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
function stopTimer(){if(started){elapsed+=Math.floor((Date.now()-started)/1000);started=0;}clearInterval(timer);}
function renderTimer(){const el=document.getElementById('clock');if(el)el.textContent=timeText(elapsed+(started?Math.floor((Date.now()-started)/1000):0));}
async function saveDraft(showToast=true){clearTimeout(draftTimer);const q=current();if(!q||!document.getElementById('code'))return;const code=document.getElementById('code').value,note=document.getElementById('note').value,runNote=document.getElementById('run-note').value;const changed=code!==(q.code||'')||note!==(q.note||'')||runNote!==(q.runNote||'');if(!changed)return;await patchQuestion(q.id,{code,note,runNote});if(showToast)toast('草稿已保存');}
function renderDetail(){const r=current();if(!r){detail.innerHTML='<p class="empty">选择一题，或在这个类别下生成新题。</p>';return;}const q=r.question;
  detail.innerHTML=`<div class="row"><h2 style="margin:0">${esc(q.title)}</h2><span class="badge tech">${esc(CATEGORIES.find(c=>c.id===r.category)?.name||'')}</span><span class="badge">${esc(r.difficulty)}</span></div>
    <p class="small muted" style="margin-top:8px">${esc(r.provider||'本地 AI CLI')} 生成 · ${esc(r.date)}</p><p style="white-space:pre-wrap">${esc(q.statement)}</p><p><b>函数签名：</b><code>${esc(q.signature)}</code></p><b>示例</b><ul>${q.examples.map(x=>`<li><code>${esc(x)}</code></li>`).join('')}</ul><b>约束</b><ul>${q.constraints.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><details><summary>需要时再看提示</summary><ol>${q.hints.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>
    <div class="row" style="margin:14px 0"><button class="btn sm" id="timer-btn">${started?'暂停计时':'开始计时'}</button><button class="btn sm" id="timer-reset">清零</button><b id="clock">${timeText(elapsed)}</b></div>
    <div class="field"><label for="code">Python 草稿（停止输入后自动保存；请在本机运行自测）</label><textarea id="code" rows="12" spellcheck="false" style="font-family:ui-monospace,monospace">${esc(r.code||'')}</textarea></div>
    <div class="field"><label for="note">思路、错误和边界情况</label><textarea id="note" rows="3">${esc(r.note||'')}</textarea></div>
    <div class="field"><label for="run-note">本机运行结果（可选，供 AI 参考）</label><textarea id="run-note" rows="2" placeholder="写下运行的输入、输出、报错或尚未运行">${esc(r.runNote||'')}</textarea></div>
    <div class="fields"><div class="field"><label for="result">本次结果</label><select id="result"><option value="passed">独立写对</option><option value="helped">看提示后写对</option><option value="blocked">未完成</option></select></div><div class="field"><label for="minutes">用时（分钟）</label><input id="minutes" type="number" min="0" max="240" value="${Math.ceil(elapsed/60)}"></div></div>
    <div class="row"><button class="btn primary" id="evaluate">AI 评估代码</button><button class="btn" id="save-attempt">保存本次练习</button><button class="btn" id="save-draft">只保存草稿</button></div>
    ${r.evaluation?`<div class="card" style="margin-top:16px"><h3 style="margin-top:0">AI 静态评估 · ${esc({likely_correct:'看起来正确',needs_work:'还需修改',insufficient_evidence:'证据不足'}[r.evaluation.verdict]||r.evaluation.verdict)}</h3>${r.code!==(r.evaluatedCode??r.code)?'<p class="muted small">代码已修改；这份评估对应上次提交的版本。请重新评估当前代码。</p>':''}<p>${esc(r.evaluation.summary)}</p><b>问题</b><ul>${r.evaluation.issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><b>建议本机运行</b><ul>${r.evaluation.testCases.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>复杂度：</b>${esc(r.evaluation.complexity)}</p><p><b>下一步：</b>${esc(r.evaluation.nextStep)}</p></div>`:''}
    <h3>本题练习记录</h3>${r.attempts?.length?`<div class="table-wrap"><table><tr><th>日期</th><th>结果</th><th>用时</th></tr>${r.attempts.slice().reverse().map(a=>`<tr><td>${esc(a.date)}</td><td>${{passed:'独立写对',helped:'借助提示',blocked:'未完成'}[a.result]||''}</td><td>${a.minutes} 分钟</td></tr>`).join('')}</table></div>`:'<p class="muted">还没有练习记录。</p>'}`;
  for(const id of ['code','note','run-note'])document.getElementById(id).addEventListener('input',()=>{clearTimeout(draftTimer);draftTimer=setTimeout(()=>saveDraft(false).catch(fail),900);});
  document.getElementById('timer-btn').onclick=()=>{if(started){stopTimer();document.getElementById('minutes').value=Math.ceil(elapsed/60);}else{started=Date.now();timer=setInterval(renderTimer,1000);}document.getElementById('timer-btn').textContent=started?'暂停计时':'开始计时';renderTimer();};
  document.getElementById('timer-reset').onclick=()=>{stopTimer();elapsed=0;renderTimer();document.getElementById('minutes').value=0;};
  document.getElementById('save-draft').onclick=()=>saveDraft().catch(fail);
  document.getElementById('save-attempt').onclick=saveAttempt;
  document.getElementById('evaluate').onclick=async e=>{const id=selectedId,code=document.getElementById('code').value,runNote=document.getElementById('run-note').value;if(!code.trim())return toast('先写 Python 代码');clearTimeout(draftTimer);e.target.disabled=true;e.target.textContent='评估中…';try{const data=await callAI('evaluate',{question:q,code,notes:runNote});const active=selectedId===id&&document.getElementById('code');const latest=active?{code:document.getElementById('code').value,note:document.getElementById('note').value,runNote:document.getElementById('run-note').value}:{code,runNote};await persist({...questions.find(x=>x.id===id),...latest,evaluation:data.evaluation,evaluatedCode:code});if(active)await saveDraft(false);toast('评估已保存');if(selectedId===id)render();}catch(err){fail(err);e.target.disabled=false;e.target.textContent='AI 评估代码';}};
}
async function saveAttempt(){const wasRunning=!!started;stopTimer();if(wasRunning&&Number(document.getElementById('minutes').value)===0)document.getElementById('minutes').value=Math.ceil(elapsed/60);clearTimeout(draftTimer);const old=current(),code=document.getElementById('code').value,result=document.getElementById('result').value,minutes=Number(document.getElementById('minutes').value);if(!Number.isFinite(minutes)||minutes<0||minutes>240)return toast('用时请输入 0–240 分钟');if(result!=='blocked'&&(!old.evaluation||code!==(old.evaluatedCode??old.code??'')))return toast('先提交当前代码给 AI 评估');const attempts=[...(old.attempts||[]),{date:today(),result,minutes}],passes=attempts.filter(a=>a.result==='passed').length;const status=result==='blocked'?'review':passes>=2?'done':result==='passed'?'practicing':'review';try{await persist({...old,code,note:document.getElementById('note').value,runNote:document.getElementById('run-note').value,attempts,status});toast('已记录练习');render();}catch(e){fail(e);}}
function render(){const c=CATEGORIES.find(x=>x.id===selectedCategory);document.getElementById('category-name').textContent=c.name;document.getElementById('category-description').textContent=c.description;renderStats();renderCategories();renderQuestionList();renderDetail();}
document.getElementById('generate').onclick=async e=>{const category=selectedCategory,difficulty=document.getElementById('difficulty').value;e.target.disabled=true;e.target.textContent='生成中…';try{await saveDraft(false);const data=await callAI('generate',{category,difficulty,recent:questions.filter(q=>q.category===category).map(q=>q.question.title)});const item={id:uid(),category,difficulty,date:today(),question:data.question,provider:data.provider,status:'new',attempts:[]};await append(item);toast('新题已生成');if(selectedCategory===category){selectedId=item.id;stopTimer();elapsed=0;render();}else renderStats();}catch(err){fail(err);}finally{e.target.disabled=false;e.target.textContent='AI 生成新题';}};
try{const stored=await api.get(skill,'progress',{questions:[]});questions=Array.isArray(stored?.questions)?stored.questions:[];selectedId=inCategory().at(-1)?.id||null;render();}catch(e){fail(e);}
</script></body></html>
